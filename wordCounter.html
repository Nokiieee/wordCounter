<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Dynalight&family=Markazi+Text:wght@400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Nunito:ital,wght@0,900;1,900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playball&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik:ital,wght@0,300..900;1,300..900&family=Shojumaru&family=Zain:ital,wght@0,200;0,300;0,400;0,700;0,800;0,900;1,300;1,400&display=swap');

        body {
            margin: 0;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 85vh;
        }

        .container {
            background-color: rgb(234, 218, 243);
            padding: 20px;
            width: 40%;
            max-width: 80%;
            border-radius: 5px;
            box-shadow: 3px 3px 12px 2px rgb(196, 196, 196);
        }

        input {
            border: none;
            width: 50%;
            padding: 5px 10px;
            border-radius: 3px;
            margin-right: 3px;
            font-family: Poppins;
            background-color: rgba(255, 255, 255, 0.918);
        }

        input:focus {
            transition: .2s;
            outline: none;
            border: none;
            background-color: rgb(255, 255, 255);
        }

        button {
            padding: 6.3px 10px;
            border: none;
            background-color: rgb(255, 91, 91);
            border-radius: 3px;
            font-family: Montserrat;
            font-weight: 600;
            color: white;
        }

        button:hover {
            transition: .2s;
            background-color: rgb(245, 88, 88);
        }

        button:active {
            background-color: rgb(235, 84, 84);
        }

        .container h3, h4 {
            font-family: Poppins;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="container">
            <input type="text">
            <button>Enter</button>

            <h3>Hi! I'm Enoch Mendoza</h3>
            <h4>Number of Words: 4</h4>
        </div>
    </div>
    
    <script>
        console.log('PC2');
        console.log('Another change from PC2');
    </script>
</body>
</html>
